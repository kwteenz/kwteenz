name: Calculadora - build APK

on:
  push:
    branches: [main]
    paths:
      - 'calculadora/**'
      - '.github/workflows/calculadora-apk.yml'
    tags: ['calculadora-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: calculadora
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar dependências
        run: npm install

      - name: Gerar projeto Android (Capacitor)
        run: |
          npx cap add android
          npx cap sync android

      - name: Compilar APK (debug)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Renomear APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk calculadora.apk

      - name: Guardar APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: calculadora-apk
          path: calculadora/calculadora.apk

      - name: Publicar APK na Release (tags calculadora-v*)
        if: startsWith(github.ref, 'refs/tags/calculadora-v')
        uses: softprops/action-gh-release@v2
        with:
          files: calculadora/calculadora.apk
